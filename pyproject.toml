[project]
name = "intelitex"
version = "1.11.0"
description = "Intelitex: checkpointed five-pass literary translation with human terminology review"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "rich>=13,<15",
  "httpx>=0.27,<1",
  "jsonschema>=4.21,<5",
  "defusedxml>=0.7,<1",
  "fastapi>=0.135,<1",
  "uvicorn>=0.41,<1",
]

[project.scripts]
intelitex = "bookpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookpipe"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
