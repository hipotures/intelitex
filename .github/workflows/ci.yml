name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install "uv==0.11.16"

      - name: Verify lock file
        run: uv lock --check

      - name: Compile Python
        run: uv run python -m compileall -q bookpipe translate.py

      - name: Run Python tests
        run: uv run --group dev python -m pytest -q

      - name: Run browser-filter logic tests
        run: node --test tests/test_review_filters.cjs
