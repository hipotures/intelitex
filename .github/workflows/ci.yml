name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"

      - name: Verify lock file
        run: uv lock --check

      - name: Compile Python
        run: uv run python -m compileall -q bookpipe translate.py

      - name: Run Python tests
        run: uv run --group dev python -m pytest -q

      - name: Run existing JavaScript tests
        run: node --test tests/*.cjs

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Install browser for frontend smoke test
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Typecheck, build and smoke-test frontend
        run: npm --prefix web test
